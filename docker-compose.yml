version: '3.8'

services:
  # 1. API Gateway (Nginx)
  gateway:
    image: nginx:latest
    container_name: hisubtory-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - user-service
      - story-service
      - activity-service
    restart: unless-stopped

  # 2. User Service
  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: hisubtory-user
    expose:
      - "8000"
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=user-service
    depends_on:
      - jaeger
      - db-postgres
      - db-mysql
    restart: unless-stopped

  # 3. Story Service
  story-service:
    build:
      context: .
      dockerfile: ./story-service/Dockerfile
    container_name: hisubtory-story
    expose:
      - "8000"
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=story-service
    depends_on:
      - jaeger
      - db-mysql
    restart: unless-stopped

  # 4. Activity Service
  activity-service:
    build:
      context: .
      dockerfile: ./activity-service/Dockerfile
    container_name: hisubtory-activity
    expose:
      - "8000"
    env_file: .env
    environment:
      - OTEL_SERVICE_NAME=activity-service
    depends_on:
      - redis
      - jaeger
      - db-mysql
    restart: unless-stopped

  # 5. Redis
  redis:
    image: redis:latest
    container_name: hisubtory-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  # 6. Database: PostgreSQL (for Supabase compat)
  db-postgres:
    image: postgres:15
    container_name: hisubtory-db-pg
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hisubtory1234
    ports:
      - "5433:5432"
    restart: unless-stopped

  # 7. Database: MySQL
  db-mysql:
    image: mysql:8.0
    container_name: hisubtory-db-mysql
    environment:
      MYSQL_DATABASE: hisubtory_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: admin
      MYSQL_PASSWORD: mysql_password
    ports:
      - "3307:3306"
    restart: unless-stopped

  # 8. Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hisubtory-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # 9. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hisubtory-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # 10. Loki
  loki:
    image: grafana/loki:latest
    container_name: hisubtory-loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # 11. Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: hisubtory-promtail
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # 12. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hisubtory-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana

  # Node-Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: hisubtory-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hisubtory-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
