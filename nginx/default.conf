server {
    listen 80;

    # 1. 프론트엔드 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Accounts (User Service)
    location /api/accounts/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/api/accounts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Stories (Story Service)
    location /api/stories/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/api/stories/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Pages/Library (Activity Service)
    location /api/pages/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/api/pages/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/library/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/api/library/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Admin
    location /admin/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Static/Media (Using user service as primary source)
    location /static/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/static/;
    }
    location /media/ {
        proxy_pass http://hisubtory-alb-913594763.ap-northeast-2.elb.amazonaws.com/media/;
    }

    # 7. Grafana
    location /grafana/ {
        proxy_pass http://hisubtory-grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Prometheus
    location /prometheus/ {
        proxy_pass http://hisubtory-prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
