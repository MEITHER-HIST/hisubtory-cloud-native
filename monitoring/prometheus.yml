global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'bastion-node-exporter'
    static_configs:
      - targets: ['hisubtory-node-exporter:9100']

  - job_name: 'django'
    metrics_path: '/metrics/'
    ecs_sd_configs:
      - region: 'ap-northeast-2'
        clusters: ['hisubtory-cluster']
    relabel_configs:
      - source_labels: [__meta_ecs_container_name]
        regex: 'app'
        action: keep
      - source_labels: [__address__]
        regex: '(.*):(.*)'
        replacement: '${1}:8000'
        target_label: __address__
      - source_labels: [__meta_ecs_task_definition_family]
        target_label: task_family
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'node-exporter'
    ecs_sd_configs:
      - region: 'ap-northeast-2'
        clusters: ['hisubtory-cluster']
    relabel_configs:
      - source_labels: [__meta_ecs_container_name]
        regex: 'node-exporter'
        action: keep
      - source_labels: [__address__]
        regex: '(.*):(.*)'
        replacement: '${1}:9100'
        target_label: __address__
      - source_labels: [__meta_ecs_task_definition_family]
        target_label: task_family
      - source_labels: [__address__]
        target_label: instance
