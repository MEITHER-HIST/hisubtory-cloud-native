name: Deploy to Amazon ECS (All Services)

on:
  push:
    branches: [ feat/do ]

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: hisubtory-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [story, user, activity, web]
        include:
          - service: story
            ecr_repo: hisubtory-story
            ecs_svc: hisubtory-story-service
            task_def: clean-story-task-def-updated.json
            dockerfile: story-service/Dockerfile
          - service: user
            ecr_repo: hisubtory-user
            ecs_svc: hisubtory-user-service
            task_def: clean-user-task-def-updated.json
            dockerfile: user-service/Dockerfile
          - service: activity
            ecr_repo: hisubtory-activity
            ecs_svc: hisubtory-activity-service
            task_def: clean-activity-task-def-updated.json
            dockerfile: activity-service/Dockerfile
          - service: web
            ecr_repo: hisubtory-web
            ecs_svc: hisubtory-web-service
            task_def: web-task-def-new.json
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG -f ${{ matrix.dockerfile }} .
          docker push $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ matrix.task_def }}
          container-name: app
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.ecs_svc }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
