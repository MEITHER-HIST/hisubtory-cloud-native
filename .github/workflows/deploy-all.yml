name: Deploy to Amazon ECS (All Services)

on:
  push:
    branches: [ feat/do ]

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: hisubtory-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [story, user, activity, web]
        include:
          - service: story
            ecr_repo: hisubtory-story
            ecs_svc: hisubtory-story-service
            task_def: clean-story-task-def-updated.json
            dockerfile: story-service/Dockerfile
          - service: user
            ecr_repo: hisubtory-user
            ecs_svc: hisubtory-user-service
            task_def: clean-user-task-def-updated.json
            dockerfile: user-service/Dockerfile
          - service: activity
            ecr_repo: hisubtory-activity
            ecs_svc: hisubtory-activity-service
            task_def: clean-activity-task-def-updated.json
            dockerfile: activity-service/Dockerfile
          - service: web
            ecr_repo: hisubtory-web
            ecs_svc: hisubtory-web-service
            task_def: web-task-def-new.json
            dockerfile: Dockerfile.web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ matrix.task_def }}
          container-name: app
          image: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}

      - name: Inject Secrets into Task Definition
        env:
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SB_DB_PASSWORD: ${{ secrets.SB_DB_PASSWORD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          envsubst < ${{ steps.task-def.outputs.task-definition }} > processed-task-def.json
          # cat processed-task-def.json # 보안을 위해 출력 제거

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: processed-task-def.json
          service: ${{ matrix.ecs_svc }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
