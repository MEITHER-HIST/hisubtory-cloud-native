<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HISUBTORY - 3호선 역사 여행</title>
    <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/pure-min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .station-node:hover { filter: brightness(1.2); cursor: pointer; }
      #story-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
      .modal-content { background: white; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 1rem; position: relative; }
      .cut-image { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-50">
        <div class="min-h-screen flex flex-col">
          <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
              <div class="relative">
                <button class="p-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors" title="노선 선택">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu w-6 h-6"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
                </button>
              </div>
              <h1 class="absolute left-1/2 transform -translate-x-1/2 text-blue-600 font-bold tracking-wider">HISUBTORY</h1>
              <div class="flex items-center gap-2">
                <button class="flex items-center gap-1 px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user w-4 h-4"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>로그인</span>
                </button>
              </div>
            </div>
          </header>
          
          <main class="flex-1 max-w-7xl mx-auto px-4 py-8 w-full">
            <div class="text-center mb-6">
              <h2 class="text-gray-900 text-2xl font-bold mb-2">서울 지하철 3호선 역사 여행</h2>
              <p class="text-gray-600">역을 클릭해서 숨겨진 역사 이야기를 확인하세요</p>
            </div>
            
            <div class="mb-6">
              <div id="map-container" class="relative w-full bg-white rounded-2xl shadow-lg p-8 overflow-x-auto">
                <svg width="1200" height="650" class="mx-auto" id="subway-svg">
                  <line x1="100" y1="100" x2="1150" y2="100" stroke="#EF7C1C" stroke-width="10" stroke-linecap="round"></line>
                  <line x1="1150" y1="100" x2="1150" y2="300" stroke="#EF7C1C" stroke-width="10" stroke-linecap="round"></line>
                  <line x1="1150" y1="300" x2="100" y2="300" stroke="#EF7C1C" stroke-width="10" stroke-linecap="round"></line>
                  <line x1="100" y1="300" x2="100" y2="500" stroke="#EF7C1C" stroke-width="10" stroke-linecap="round"></line>
                  <line x1="100" y1="500" x2="1010" y2="500" stroke="#EF7C1C" stroke-width="10" stroke-linecap="round"></line>
                  <g id="station-nodes"></g>
                </svg>
              </div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6">
              <h3 class="text-gray-900 mb-4 font-semibold">랜덤 역 선정</h3>
              <button onclick="pickRandom()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shuffle w-5 h-5"><path d="m18 14 4 4-4 4"></path><path d="m18 2 4 4-4 4"></path><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"></path><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"></path><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"></path></svg>랜덤 역 뽑기
              </button>
            </div>
          </main>
        </div>
      </div>
    </div>

    <!-- Story Modal -->
    <div id="story-modal" onclick="closeModal(event)">
      <div class="modal-content" onclick="event.stopPropagation()">
        <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/50 text-white p-2 rounded-full hover:bg-black/70 font-bold w-10 h-10">X</button>
        <div id="story-viewer" class="p-0">
          <div id="story-header" class="p-6 border-b">
            <h2 id="modal-title" class="text-2xl font-bold">제목</h2>
            <p id="modal-subtitle" class="text-gray-600">부제목</p>
          </div>
          <div id="cuts-container" class="space-y-0 p-0">
            <!-- Cuts will be loaded here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      const stationsData = ["대화","주엽","정발산","마두","백석","대곡","화정","원당","원흥","삼송","지축","구파발","연신내","불광","녹번","홍제","무악재","독립문","경복궁","안국","종로3가","을지로3가","충무로","동대입구","약수","금호","옥수","압구정","신사","잠원","고속터미널","교대","남부터미널","양재","매봉","도곡","대치","학여울","대청","일원","수서","가락시장","경찰병원","오금"];
      
      function renderStations() {
        const group = document.getElementById('station-nodes');
        let html = '';
        stationsData.forEach((name, i) => {
          let x, y;
          if (i < 16) { x = 100 + (i * 70); y = 100; }
          else if (i < 17) { x = 1150; y = 300; }
          else if (i < 31) { x = 1150 - ((i-16) * 70); y = 300; }
          else if (i < 32) { x = 100; y = 500; }
          else { x = 100 + ((i-31) * 70); y = 500; }

          html += `
            <g class="station-node" onclick="fetchStoryByStation(${i+1})">
              <circle cx="${x}" cy="${y}" r="14" fill="#EF7C1C" stroke="white" stroke-width="4"></circle>
              <text x="${x}" y="${y < 300 ? y-25 : y+35}" text-anchor="middle" class="text-[10px] font-bold" fill="#374151">${name}</text>
            </g>
          `;
        });
        group.innerHTML = html;
      }

      async function fetchStoryByStation(stationId) {
        try {
          const resp = await fetch(`/api/pages/v1/episode/pick/?station_id=${stationId}`);
          const data = await resp.json();
          if (data.success) {
            loadEpisode(data.episode_id);
          } else {
            alert("이 역에는 아직 등록된 이야기가 없습니다.");
          }
        } catch (e) { console.error(e); }
      }

      async function loadEpisode(episodeId) {
        try {
          const resp = await fetch(`/api/stories/episode/detail/?episode_id=${episodeId}`);
          const data = await resp.json();
          if (data.success) {
            document.getElementById('modal-title').innerText = data.episode.webtoon_title || "HISUBTORY";
            document.getElementById('modal-subtitle').innerText = data.episode.episode_title || data.episode.subtitle;
            const container = document.getElementById('cuts-container');
            container.innerHTML = data.cuts.map(cut => `
              <div class="cut-item">
                <img src="${cut.image_url || cut.image}" class="cut-image" alt="cut" onerror="this.src='https://via.placeholder.com/800x600?text=Image+Not+Found'">
                ${cut.caption ? `<div class="p-6 text-gray-800 leading-relaxed bg-white border-b">${cut.caption}</div>` : ''}
              </div>
            `).join('');
            document.getElementById('story-modal').style.display = 'flex';
          }
        } catch (e) { console.error(e); }
      }

      function closeModal() { document.getElementById('story-modal').style.display = 'none'; }
      function pickRandom() {
        fetch('/api/pages/v1/episode/random/')
          .then(r => r.json())
          .then(d => { if(d.success) loadEpisode(d.episode_id); });
      }

      renderStations();
    </script>
  </body>
</html>
